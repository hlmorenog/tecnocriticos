<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Estilo cine · demo plegables</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; background: #0b0d0c; overflow: hidden; }
#lienzo { position: relative; width: 1080px; height: 1920px; overflow: hidden;
  background: radial-gradient(1100px 900px at 50% 38%, #17201c 0%, #0e1210 45%, #090a0a 100%); }
svg#esc { position: absolute; inset: 0; }
#grano { position: absolute; inset: -50%; width: 200%; height: 200%; opacity: .07; pointer-events: none; mix-blend-mode: screen; }
#vin { position: absolute; inset: 0; background: radial-gradient(1200px 1500px at 50% 45%, transparent 55%, rgba(0,0,0,.65) 100%); pointer-events: none; }
.cab { position: absolute; top: 70px; left: 72px; right: 72px; display: flex; justify-content: space-between; align-items: center; font: 700 22px 'JetBrains Mono'; letter-spacing: .16em; text-transform: uppercase; }
.cab .logo { font: 800 30px 'Inter Tight'; letter-spacing: -.03em; text-transform: none; color: #f4f4f1; display: flex; gap: 12px; align-items: center; }
.cab .logo i { width: 16px; height: 16px; border-radius: 50%; background: #00875A; box-shadow: 0 0 14px #00c389; }
.cab .tag { color: #7FD1B0; transition: none; }
#sub { position: absolute; left: 90px; right: 90px; top: 1420px; text-align: center; font: 800 62px/1.18 'Inter Tight'; letter-spacing: -.02em; color: #f4f4f1; }
#sub span { display: inline-block; margin: 0 .12em; }
#sub .k { color: #7FD1B0; text-shadow: 0 0 30px rgba(127,209,176,.45); }
.barra { position: absolute; left: 0; bottom: 0; height: 8px; background: #00875A; box-shadow: 0 0 16px #00c389; }
</style>
</head>
<body>
<div id="lienzo">
  <svg id="esc" viewBox="0 0 1080 1920"></svg>
  <svg id="grano" viewBox="0 0 400 400" preserveAspectRatio="none"><filter id="ruido"><feTurbulence id="turb" type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="1"/></filter><rect width="400" height="400" filter="url(#ruido)"/></svg>
  <div id="vin"></div>
  <div class="cab"><div class="logo"><i></i>tecnocríticos</div><div class="tag" id="tag"></div></div>
  <div id="sub"></div>
  <div class="barra" id="barra"></div>
</div>
<script>
/* ===== Motor «cine» de Tecnocríticos: fondo oscuro con grano, nodos que brillan, líneas que se dibujan,
   partículas de luz, cámara en movimiento y subtítulos palabra por palabra sincronizados con la voz. ===== */
const V = "#00875A", M = "#7FD1B0", A = "#F0C36B", PL = "#E8E8E4", AZ = "#4C86F5";
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = cl(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const out = (x) => 1 - Math.pow(1 - cl(x), 3);
const tramo = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;

/* Palabras de la locución (tiempo en segundos de la mezcla final). k = palabra clave en verde. */
const PALABRAS = [[0,"iPhone",1],[0.78,"Duo",1],[1.04,"o"],[1.5,"Galaxy",1],[1.76,"Z",1],[2.08,"Fold",1],[2.34,"8.",1],
 [3.2,"La"],[3.46,"ficha"],[3.62,"técnica"],[4.0,"dice"],[4.26,"mucho,"],[4.84,"pero"],[5.02,"no",1],[5.14,"todo.",1],
 [5.78,"Te"],[5.94,"contamos"],[6.32,"cómo"],[6.8,"es"],[7.0,"vivir",1],[7.16,"con"],[7.46,"cada"],[7.66,"uno,"],
 [8.28,"según"],[8.48,"quienes"],[8.86,"ya"],[9.0,"lo"],[9.12,"usan.",1],
 [10.22,"La"],[10.74,"primera"],[10.96,"diferencia"],[11.44,"se"],[11.64,"siente"],[11.9,"en"],[12.04,"la"],[12.14,"mano.",1],
 [12.68,"El"],[12.8,"Fold",1],[13.0,"8",1],[13.38,"pesa"],[13.74,"201",1],[14.22,"gramos",1],[15.04,"y"],[15.18,"se"],[15.28,"siente"],[15.54,"casi"],[15.8,"como"],[16.1,"un"],[16.22,"celular"],[16.5,"normal.",1],
 [17.46,"El"],[17.68,"Duo",1],[17.86,"pesa"],[18.2,"254.",1],
 [19.5,"Un"],[19.74,"reseñista"],[20.16,"contó"],[20.66,"que"],[21.0,"después"],[21.28,"de"],[21.46,"un"],[21.56,"buen"],[21.64,"rato"],[21.96,"de"],[22.12,"uso"],[22.32,"le"],[22.6,"dolía",1],[22.84,"la"],[22.96,"muñeca.",1],
 [23.84,"A"],[24.08,"cambio,"],[24.68,"el"],[24.7,"Duo",1],[24.9,"es"],[25.04,"más"],[25.18,"corto",1],[25.6,"y"],[25.68,"el"],[25.78,"pulgar",1],[26.16,"llega"],[26.44,"mejor"],[26.82,"a"],[26.94,"la"],[27.0,"parte"],[27.28,"de"],[27.46,"arriba.",1]];
const DUR = 28.6;
window.DURACION = DUR;

/* Frases de subtítulo: se cortan en la puntuación o a las 6 palabras. */
const FRASES = []; { let f = []; PALABRAS.forEach((p, i) => { f.push(p); const resto = PALABRAS.slice(i + 1).findIndex((q) => /[.,]$/.test(q[1])) + 1; const fin = /[.,]$/.test(p[1]) || (f.length >= 7 && resto > 2) || i === PALABRAS.length - 1; if (fin) { FRASES.push(f); f = []; } }); }
function subtitulos(t) {
  let idx = FRASES.findIndex((f, i) => t >= f[0][0] - 0.12 && (i === FRASES.length - 1 || t < FRASES[i + 1][0][0] - 0.12));
  if (idx < 0) return "";
  const f = FRASES[idx], finF = f[f.length - 1][0] + 0.9;
  const sale = idx < FRASES.length - 1 ? 1 : 1 - tramo(t, finF, finF + 0.4);
  return f.map((p) => { const a = out(tramo(t, p[0] - 0.05, p[0] + 0.18)); const y = (1 - a) * 18;
    return `<span class="${p[2] ? "k" : ""}" style="opacity:${(0.18 + 0.82 * a) * sale};transform:translateY(${y}px)">${p[1]}</span>`; }).join("");
}

/* ===== Piezas de dibujo ===== */
function nodo(x, y, r, color, brillo = 1, etiqueta = "", sub = "") {
  const id = "g" + color.slice(1);
  return `<g transform="translate(${x} ${y})">
    <circle r="${r * 3.2}" fill="url(#h${id})" opacity="${0.55 * brillo}"/>
    <circle r="${r * 1.55}" fill="none" stroke="${color}" stroke-opacity="${0.25 * brillo}" stroke-width="2"/>
    <circle r="${r}" fill="url(#s${id})"/>
    <circle r="${r}" fill="none" stroke="${color}" stroke-width="3" stroke-opacity="${0.6 + 0.4 * brillo}"/>
    <ellipse cx="${-r * .3}" cy="${-r * .38}" rx="${r * .38}" ry="${r * .22}" fill="#fff" opacity="${0.35 * brillo}"/>
    ${etiqueta ? `<text y="${r + 78}" text-anchor="middle" font-family="Inter Tight" font-weight="800" font-size="48" fill="#f4f4f1" opacity="${brillo}">${etiqueta}</text>` : ""}
    ${sub ? `<text y="${r + 120}" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="22" letter-spacing="4" fill="${color}" opacity="${0.85 * brillo}">${sub}</text>` : ""}
  </g>`;
}
function defs() {
  const g = (c) => `<radialGradient id="hg${c.slice(1)}"><stop offset="0" stop-color="${c}" stop-opacity=".9"/><stop offset=".35" stop-color="${c}" stop-opacity=".25"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>
    <radialGradient id="sg${c.slice(1)}" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset=".25" stop-color="${c}"/><stop offset="1" stop-color="#0b0d0c"/></radialGradient>`;
  return `<defs>${[V, M, A, PL, AZ].map(g).join("")}
    <filter id="luz" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="5000" height="6000"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
}
/* Línea que se dibuja (k de 0 a 1) con partículas que viajan por ella. */
function linea(x1, y1, x2, y2, k, t, color = M, n = 3) {
  const x = lerp(x1, x2, k), y = lerp(y1, y2, k);
  let s = `<line x1="${x1}" y1="${y1}" x2="${x}" y2="${y}" stroke="${color}" stroke-width="3" stroke-opacity=".55" filter="url(#luz)"/>`;
  if (k >= 1) for (let i = 0; i < n; i++) { const u = ((t * 0.45 + i / n) % 1); s += `<circle cx="${lerp(x1, x2, u)}" cy="${lerp(y1, y2, u)}" r="5" fill="#fff" opacity="${Math.sin(u * Math.PI)}" filter="url(#luz)"/>`; }
  return s;
}
/* Teléfono plegable abierto, en trazo de luz. */
function telefono(cx, cy, w, h, color, k = 1, op = 1) {
  const per = 2 * (w + h);
  return `<g opacity="${op}" filter="url(#luz)">
    <rect x="${cx - w / 2}" y="${cy - h / 2}" width="${w}" height="${h}" rx="${w * .09}" fill="${color}" fill-opacity="${0.06 * k}" stroke="${color}" stroke-width="5" stroke-dasharray="${per}" stroke-dashoffset="${per * (1 - k)}"/>
    <line x1="${cx}" y1="${cy - h / 2 + 14}" x2="${cx}" y2="${cy - h / 2 + 14 + (h - 28) * k}" stroke="${color}" stroke-opacity=".45" stroke-width="2" stroke-dasharray="6 8"/>
    <circle cx="${cx + w / 2 - 26}" cy="${cy - h / 2 + 26}" r="6" fill="${color}" opacity="${k}"/></g>`;
}
/* Personas como puntos de luz alrededor. */
function personas(cx, cy, r, k, t, color) {
  let s = ""; const n = 14;
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2 + t * 0.15, rr = r + 30 * Math.sin(i * 2.1); const ap = out(tramo(k * n, i, i + 1));
    s += `<g transform="translate(${cx + Math.cos(a) * rr} ${cy + Math.sin(a) * rr * .55})" opacity="${ap * .9}"><circle r="7" cy="-14" fill="${color}"/><path d="M-10 6 Q0 -8 10 6" stroke="${color}" stroke-width="4" fill="none"/></g>`; }
  return s;
}
function cifra(x, y, valor, k, color, tam = 120, sufijo = " g") {
  return `<text x="${x}" y="${y}" text-anchor="middle" font-family="Inter Tight" font-weight="900" font-size="${tam}" letter-spacing="-3" fill="${color}" filter="url(#luz)" opacity="${out(k * 3)}">${Math.round(valor * out(k))}${sufijo}</text>`;
}

/* ===== Escena ===== */
function escena(t) {
  let s = defs();
  // Cámara: acercamientos suaves entre momentos.
  const zoom = lerp(1, 1.06, ease(tramo(t, 0, 3.2))) * lerp(1, 0.94, ease(tramo(t, 3.2, 5.5))) * lerp(1, 1.04, ease(tramo(t, 5.5, 9.6)));
  const camY = lerp(0, -40, ease(tramo(t, 5.5, 9.6)));
  let g = "";
  const xa = 330, xb = 750, y0 = 720;

  if (t < 10.0) {
    // 1) Los dos nodos: Duo (plata) y Fold (azul), unidos por una línea con partículas.
    const ka = out(tramo(t, 0.5, 1.1)), kb = out(tramo(t, 1.8, 2.4));
    const aMorf = ease(tramo(t, 5.8, 6.8)); // los nodos se convierten en teléfonos
    const sal = 1 - ease(tramo(t, 9.4, 10.0));
    if (t > 2.4) g += linea(xa + 110, y0, xb - 110, y0, out(tramo(t, 2.4, 3.0)), t, M, 4);
    // 2) La ficha técnica: líneas de datos que salen de cada nodo y se apagan en «pero no todo».
    const datos = [["7,6″", -150], ["A20 Pro", -60], ["IP68", 30], ["254 g", 120]], datosB = [["7,6″", -150], ["Snapdragon", -60], ["IP48", 30], ["201 g", 120]];
    const kd = out(tramo(t, 3.3, 4.2)), apaga = 1 - ease(tramo(t, 4.9, 5.6));
    if (t > 3.2 && t < 5.8) {
      datos.forEach(([txt, dy], i) => { const ki = out(tramo(t, 3.3 + i * .15, 4.0 + i * .15)) * apaga;
        g += `<g opacity="${ki}">${linea(xa - 80, y0, 120, y0 + dy * 1.6, 1, t, PL, 1)}<text x="110" y="${y0 + dy * 1.6 - 14}" text-anchor="start" font-family="JetBrains Mono" font-weight="700" font-size="26" fill="${PL}">${txt}</text></g>`; });
      datosB.forEach(([txt, dy], i) => { const ki = out(tramo(t, 3.4 + i * .15, 4.1 + i * .15)) * apaga;
        g += `<g opacity="${ki}">${linea(xb + 80, y0, 960, y0 + dy * 1.6, 1, t, AZ, 1)}<text x="970" y="${y0 + dy * 1.6 - 14}" text-anchor="end" font-family="JetBrains Mono" font-weight="700" font-size="26" fill="${AZ}">${txt}</text></g>`; });
    }
    if (aMorf < 1) {
      g += `<g opacity="${(1 - aMorf) * sal}" transform="translate(${xa} ${y0}) scale(${ka}) translate(${-xa} ${-y0})">${nodo(xa, y0, 92, PL, 1, "iPhone Duo", "APPLE")}</g>`;
      g += `<g opacity="${(1 - aMorf) * sal}" transform="translate(${xb} ${y0}) scale(${kb}) translate(${-xb} ${-y0})">${nodo(xb, y0, 92, AZ, 1, "Galaxy Z Fold 8", "SAMSUNG")}</g>`;
    }
    if (aMorf > 0) {
      g += `<g opacity="${sal}">${telefono(xa, y0, 300 * lerp(.4, 1, aMorf), 250 * lerp(.4, 1, aMorf), PL, aMorf)}${telefono(xb, y0, 290 * lerp(.4, 1, aMorf), 330 * lerp(.4, 1, aMorf), AZ, aMorf)}</g>`;
      g += `<g opacity="${aMorf * sal}"><text x="${xa}" y="${y0 + 250}" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="24" letter-spacing="4" fill="${PL}">IPHONE DUO</text><text x="${xb}" y="${y0 + 250}" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="24" letter-spacing="4" fill="${AZ}">GALAXY Z FOLD 8</text></g>`;
    }
    // 3) «Según quienes ya lo usan»: aparecen usuarios alrededor.
    if (t > 8.2) g += `<g opacity="${sal}">${personas(xa, y0, 240, tramo(t, 8.3, 9.3), t, PL)}${personas(xb, y0, 240, tramo(t, 8.4, 9.4), t, AZ)}</g>`;
  } else {
    // 4) «En la mano»: una balanza de luz. El Fold (201 g) a la derecha, el Duo (254 g) a la izquierda.
    const entra = out(tramo(t, 10.1, 11.2));
    const kf = tramo(t, 13.7, 14.9), kd = tramo(t, 18.2, 19.3);
    const inc = lerp(0, -4, ease(kf)) + lerp(0, 13, ease(kd)); // grados: la balanza se inclina hacia el Duo
    const cx = 540, cy = 760, L = 330, bajo = ease(tramo(t, 19.3, 20.2)); // la balanza sube para dar paso a la muñeca
    const esc = lerp(1, 0.6, bajo), dy = lerp(0, -330, bajo), vete = 1 - ease(tramo(t, 23.7, 24.4));
    let b = `<g opacity="${entra * vete}" transform="translate(${cx} ${cy + dy}) scale(${esc})">`;
    b += `<path d="M-60 330 L60 330 L14 0 L-14 0 Z" fill="${V}" fill-opacity=".12" stroke="${M}" stroke-width="3" filter="url(#luz)"/>`;
    b += `<g transform="rotate(${inc})">${linea(-L, 0, L, 0, out(tramo(t, 10.3, 11.1)), t, M, 5)}`;
    const plato = (x, color, nombre, val, k, rot) => `<g transform="translate(${x} 0) rotate(${-rot})">
        <line x1="0" y1="0" x2="-70" y2="150" stroke="${color}" stroke-opacity=".5" stroke-width="2"/><line x1="0" y1="0" x2="70" y2="150" stroke="${color}" stroke-opacity=".5" stroke-width="2"/>
        <path d="M-110 150 Q0 200 110 150" fill="none" stroke="${color}" stroke-width="5" filter="url(#luz)"/>
        ${telefono(0, 95, 120, nombre === "Duo" ? 100 : 136, color, out(tramo(t, nombre === "Duo" ? 17.5 : 12.7, nombre === "Duo" ? 18.2 : 13.4)), 1)}
        ${cifra(0, 300, val, k, color, 104)}
        <text y="350" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="24" letter-spacing="4" fill="${color}" opacity="${out(k * 3)}">${nombre === "Duo" ? "IPHONE DUO" : "GALAXY Z FOLD 8"}</text></g>`;
    b += plato(-L, PL, "Duo", 254, kd, inc) + plato(L, AZ, "Fold", 201, kf, inc);
    b += `</g>${nodo(0, 0, 18, M, .8)}</g>`;
    g += b;
    // «casi como un celular normal»: aparece un teléfono normal fantasma junto al Fold.
    const kn = out(tramo(t, 16.1, 16.8)) * (1 - ease(tramo(t, 17.3, 17.9)));
    if (kn > 0) g += `<g opacity="${kn * .8}">${telefono(890, 560, 86, 170, M, kn)}<text x="890" y="690" text-anchor="middle" font-family="JetBrains Mono" font-size="20" font-weight="700" letter-spacing="3" fill="${M}">CELULAR NORMAL</text></g>`;
    // «le dolía la muñeca»: mano y muñeca con un pulso de luz ámbar.
    const km = out(tramo(t, 19.6, 20.4)) * (1 - ease(tramo(t, 23.5, 24.1)));
    if (km > 0) {
      const pul = tramo(t, 22.6, 23.4) > 0 ? 0.5 + 0.5 * Math.sin(t * 9) : 0;
      const tubo = (d, w) => `<path d="${d}" fill="none" stroke="${PL}" stroke-width="${w + 8}" stroke-linecap="round" stroke-linejoin="round" filter="url(#luz)"/><path d="${d}" fill="none" stroke="#101412" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
      const kb2 = out(tramo(t, 19.8, 20.8));
      g += `<g opacity="${km}" transform="translate(560 1000)">
        ${tubo(`M-330 300 L${lerp(-330, -60, kb2)} ${lerp(300, 60, kb2)}`, 86)}
        ${kb2 > .95 ? tubo("M-60 60 Q20 0 70 -30", 104) : ""}
        <g opacity="${out(tramo(t, 20.6, 21.2))}">${telefono(110, -120, 210, 190, PL, out(tramo(t, 20.6, 21.4)))}</g>
        <circle cx="-60" cy="60" r="${46 + 26 * pul}" fill="url(#hg${A.slice(1)})" opacity="${tramo(t, 22.5, 22.9)}"/>
        <circle cx="-60" cy="60" r="16" fill="${A}" opacity="${tramo(t, 22.5, 22.9)}" filter="url(#luz)"/>
        <text x="-60" y="190" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="24" letter-spacing="4" fill="${A}" opacity="${tramo(t, 22.6, 23.0)}">MUÑECA</text></g>`;
    }
    // «el pulgar llega mejor a la parte de arriba»: dos teléfonos con el arco del pulgar.
    const kp = out(tramo(t, 24.4, 25.3));
    if (kp > 0) {
      const arco = (x, h, color, alcanza, k) => {
        const top = 980 - h / 2, base = 980 + h / 2, r = 230;
        const ang = alcanza ? 1 : 0.78;
        return `${telefono(x, 980, 230, h, color, kp)}
          <path d="M${x - 115} ${base} A ${r} ${r} 0 0 1 ${x - 115 + r * Math.sin(ang * k * 1.25)} ${base - r * (1 - Math.cos(ang * k * 1.25)) - (alcanza ? (h - 40) * k * .78 : (h - 40) * k * .52)}" fill="none" stroke="${alcanza ? M : A}" stroke-width="7" stroke-linecap="round" filter="url(#luz)" opacity="${k > 0 ? 1 : 0}"/>
          <line x1="${x - 115}" x2="${x + 115}" y1="${top + 50}" y2="${top + 50}" stroke="${alcanza ? M : A}" stroke-opacity="${.5 * k}" stroke-dasharray="8 8" stroke-width="3"/>
          <text x="${x}" y="${base + 70}" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="24" letter-spacing="4" fill="${color}">${alcanza ? "IPHONE DUO" : "GALAXY Z FOLD 8"}</text>`;
      };
      const ka = ease(tramo(t, 25.8, 27.4));
      g += `<g opacity="${kp}">${arco(330, 300, PL, true, ka)}${arco(750, 400, AZ, false, ka)}</g>`;
    }
  }
  s += `<g transform="translate(540 ${960 + camY}) scale(${zoom}) translate(-540 -960)">${g}</g>`;
  return s;
}

function etiqueta(t) { return t < 3.2 ? "Comparativa · Plegables" : t < 10 ? "La ficha técnica" : t < 23.8 ? "En la mano" : "En la mano · El pulgar"; }

window.render = (t) => {
  document.getElementById("esc").innerHTML = escena(t);
  document.getElementById("sub").innerHTML = subtitulos(t);
  document.getElementById("tag").textContent = etiqueta(t);
  document.getElementById("turb").setAttribute("seed", String(Math.floor(t * 24) % 97));
  document.getElementById("barra").style.width = (t / DUR * 100) + "%";
};
window.render(0);
</script>
</body>
</html>
